<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тревел-компромисс</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root {
  --orange: #fe5823;
  --purple: #a180ff;
  --lime: #d0fe1b;

  --bg: #ffffff;
  --paper: #ffffff;
  --ink: #17131f;
  --muted: #74707b;

  --line: #e7e3ec;
  --soft-purple: #f0ebff;
  --soft-orange: #fff0eb;
  --soft-lime: #f3ffd0;

  --shadow: 0 25px 70px rgba(33, 20, 50, .10);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#api-base {
  display: none;
}

#app {
  min-height: 100vh;
}

/* =========================================================
   GLOBAL
========================================================= */

.page,
.form-page,
.result-page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.shell {
  width: min(1180px, calc(100% - 48px));
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.topbar {
  height: 88px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  font-weight: 700;
  letter-spacing: -.03em;
}

.logo-mark {
  width: 31px;
  height: 31px;
  border-radius: 9px;
  background: var(--purple);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 800;
  transform: rotate(-7deg);
}

.logo span {
  font-size: 15px;
}

.step-counter {
  background: var(--lime);
  color: var(--ink);
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 24px;
  font-weight: 700;
}

.eyebrow-dot {
  width: 8px;
  height: 8px;
  background: var(--orange);
  border-radius: 50%;
}

h1 {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(58px, 7vw, 102px);
  line-height: .91;
  letter-spacing: -.055em;
  font-weight: 500;
  margin: 0;
}

h1 em,
h2 em {
  color: var(--purple);
  font-style: italic;
}

.lead {
  max-width: 500px;
  margin: 30px 0 38px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.7;
}

.primary-btn {
  border: 0;
  background: var(--purple);
  color: var(--ink);
  border-radius: 14px;
  padding: 17px 25px;
  min-width: 210px;
  font-weight: 700;
  font-size: 14px;
  transition: transform .2s, background .2s, box-shadow .2s;
  box-shadow: 0 8px 0 #8062dd;
}

.primary-btn:hover {
  transform: translateY(-3px);
  background: var(--lime);
  box-shadow: 0 8px 0 #9abb00;
}

.primary-btn:active {
  transform: translateY(3px);
  box-shadow: 0 3px 0 #8062dd;
}

.primary-btn:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
  box-shadow: none;
}

.secondary-btn {
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  border-radius: 999px;
  padding: 14px 20px;
  font-size: 13px;
  font-weight: 600;
}

.muted {
  color: var(--muted);
}

.error {
  color: #c83c22;
  font-size: 13px;
  margin-top: 15px;
  font-weight: 600;
}

/* =========================================================
   CREATE
========================================================= */

.hero-grid {
  min-height: calc(100vh - 88px);
  display: grid;
  grid-template-columns: 1.08fr .92fr;
  gap: 70px;
  align-items: center;
  padding: 40px 0 90px;
}

.travel-visual {
  height: 560px;
  border-radius: 38px;
  background: var(--purple);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.visual-image {
  position: absolute;
  inset: 0;

  /*
    Фото оставляем как декоративный слой.
    API и логика проекта от него НЕ зависят.
  */
  background:
    linear-gradient(
      135deg,
      rgba(161,128,255,.70),
      rgba(254,88,35,.28)
    ),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85")
    center/cover;
}

.visual-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle at 25% 20%,
      rgba(208,254,27,.9),
      transparent 22%
    ),
    linear-gradient(
      to top,
      rgba(20,12,30,.58),
      transparent 65%
    );
}

.route-line {
  position: absolute;
  width: 280px;
  height: 140px;
  border-top: 2px solid white;
  border-radius: 50%;
  transform: rotate(-12deg);
  top: 43%;
  left: 25%;
}

.route-line::before,
.route-line::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  background: var(--lime);
  border: 3px solid white;
  border-radius: 50%;
  top: -7px;
}

.route-line::before {
  left: -5px;
}

.route-line::after {
  right: -5px;
}

.visual-label {
  position: absolute;
  left: 28px;
  bottom: 26px;
  color: white;
}

.visual-label small {
  display: block;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 9px;
  opacity: .8;
  margin-bottom: 6px;
}

.visual-label strong {
  font-family: "Playfair Display", serif;
  font-size: 34px;
  font-weight: 500;
}

/* =========================================================
   FORM
========================================================= */

.form-shell {
  width: min(920px, calc(100% - 40px));
  margin: 0 auto;
  padding: 25px 0 80px;
}

.form-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 25px 0 45px;
}

.form-header h2 {
  font-family: "Playfair Display", serif;
  font-size: clamp(40px, 6vw, 64px);
  font-weight: 500;
  line-height: .95;
  letter-spacing: -.045em;
  margin: 0;
  max-width: 600px;
}

.form-header p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  max-width: 280px;
  margin: 5px 0 0;
}

.form-card {
  background: var(--paper);
  border: 2px solid var(--purple);
  border-radius: 30px;
  padding: clamp(25px, 5vw, 55px);
  box-shadow: var(--shadow);
}

.field {
  margin-bottom: 34px;
}

.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.field-label span:first-child {
  font-weight: 700;
  font-size: 13px;
}

.field-number {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .1em;
}

.text-input {
  width: 100%;
  border: 0;
  border-bottom: 2px solid var(--line);
  background: transparent;
  padding: 12px 0;
  font-size: 20px;
  color: var(--ink);
  outline: none;
  transition: border-color .2s;
}

.text-input:focus {
  border-color: var(--orange);
}

.date-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
}

.date-input {
  width: 100%;
  padding: 18px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: white;
  color: var(--ink);
  outline: none;
}

.date-input:focus {
  border-color: var(--purple);
}

.tag-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.tag {
  border: 2px solid var(--line);
  border-radius: 15px;
  padding: 18px 16px;
  background: white;
  color: var(--ink);
  text-align: left;
  font-size: 13px;
  transition: all .2s;
  font-weight: 600;
}

.tag:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
}

.tag.active {
  background: var(--purple);
  color: var(--ink);
  border-color: var(--purple);
  box-shadow: 4px 4px 0 var(--lime);
}

.tag-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 11px;
  color: var(--orange);
}

.tag.active .tag-icon {
  color: var(--ink);
}

.budget-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
}

.budget-value {
  min-width: 150px;
  font-family: "Playfair Display", serif;
  font-size: 28px;
}

input[type="range"] {
  appearance: none;
  width: 100%;
  height: 5px;
  border-radius: 10px;
  background: var(--purple);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--orange);
  border: 4px solid white;
  box-shadow: 0 0 0 2px var(--orange);
  cursor: pointer;
}

.submit-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 45px;
}

/* =========================================================
   INVITE
========================================================= */

.center-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at 10% 10%, #f0ebff, transparent 28%),
    radial-gradient(circle at 90% 90%, #fff0eb, transparent 30%),
    white;
}

.center-card {
  width: min(780px, 100%);
  background: white;
  border: 2px solid var(--purple);
  border-radius: 35px;
  padding: clamp(30px, 6vw, 65px);
  box-shadow: var(--shadow);
  text-align: center;
}

.center-card h2 {
  font-family: "Playfair Display", serif;
  font-weight: 500;
  font-size: clamp(44px, 6vw, 70px);
  line-height: .95;
  letter-spacing: -.05em;
  margin: 10px 0 20px;
}

.center-card > p {
  color: var(--muted);
  max-width: 520px;
  margin: 0 auto 40px;
  line-height: 1.6;
  font-size: 14px;
}

.invites {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  text-align: left;
}

.invite {
  border: 0;
  border-radius: 20px;
  padding: 22px;
  background: var(--orange);
}

.invite:nth-child(2) {
  background: var(--purple);
}

.invite-number {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 800;
}

.invite-link {
  margin: 13px 0 18px;
  font-size: 11px;
  word-break: break-all;
  line-height: 1.5;
}

.copy-btn {
  border: 0;
  background: white;
  color: var(--ink);
  padding: 10px 15px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

.copy-btn:hover {
  background: var(--lime);
}

/* =========================================================
   WAITING
========================================================= */

.waiting {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 45%, #f0ebff 0%, white 48%);
}

.wait-card {
  text-align: center;
  width: min(700px, calc(100% - 40px));
}

.wait-orbit {
  width: 220px;
  height: 220px;
  margin: 0 auto 45px;
  border: 3px solid var(--purple);
  border-radius: 50%;
  position: relative;
  animation: orbit 12s linear infinite;
}

.wait-orbit::before {
  content: "✈";
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--lime);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  font-size: 17px;
  animation: counterorbit 12s linear infinite;
}

.wait-orbit::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  background: var(--orange);
  border-radius: 50%;
  top: 50%;
  left: -8px;
  transform: translateY(-50%);
  box-shadow: 0 0 0 6px #fff0eb;
}

@keyframes orbit {
  to {
    transform: rotate(360deg);
  }
}

@keyframes counterorbit {
  to {
    transform: translateX(-50%) rotate(-360deg);
  }
}

.wait-card h2 {
  font-family: "Playfair Display", serif;
  font-weight: 500;
  font-size: clamp(44px, 7vw, 76px);
  line-height: .95;
  letter-spacing: -.05em;
  margin: 0 0 18px;
}

.wait-card p {
  color: var(--muted);
  font-size: 14px;
}

.status-list {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.status-pill {
  background: white;
  border: 2px solid var(--line);
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}

.status-pill.done {
  border-color: var(--lime);
  background: var(--lime);
}

/* =========================================================
   RESULT
========================================================= */

.result-shell {
  width: min(1100px, calc(100% - 40px));
  margin: 0 auto;
  padding-bottom: 100px;
}

.result-heading {
  padding: 55px 0 45px;
}

.result-heading h2 {
  font-family: "Playfair Display", serif;
  font-weight: 500;
  font-size: clamp(50px, 8vw, 92px);
  letter-spacing: -.055em;
  line-height: .9;
  margin: 0;
}

.result-heading p {
  color: var(--muted);
  margin: 22px 0 0;
  font-size: 14px;
}

.result-hero {
  min-height: 520px;
  border-radius: 35px;
  overflow: hidden;
  position: relative;
  color: white;
  box-shadow: var(--shadow);
  margin-bottom: 25px;
  background: var(--purple);
}

.result-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}

.result-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to top,
      rgba(30,16,42,.78),
      rgba(30,16,42,.04) 72%
    );
}

.result-content {
  position: absolute;
  inset: auto 45px 40px;
  z-index: 2;
}

.match-badge {
  display: inline-flex;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--lime);
  color: var(--ink);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.result-city {
  font-family: "Playfair Display", serif;
  font-size: clamp(65px, 10vw, 125px);
  line-height: .82;
  letter-spacing: -.06em;
  font-weight: 500;
  margin: 0;
}

.result-sub {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.result-chip {
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--orange);
  color: white;
  font-size: 11px;
  font-weight: 700;
}

.result-chip:nth-child(2) {
  background: var(--purple);
  color: var(--ink);
}

.result-chip:nth-child(3) {
  background: var(--lime);
  color: var(--ink);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 45px;
}

.metric {
  background: white;
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 22px;
}

.metric:nth-child(1) {
  border-color: var(--purple);
}

.metric:nth-child(2) {
  border-color: var(--orange);
}

.metric:nth-child(3) {
  border-color: var(--lime);
}

.metric-label {
  color: var(--muted);
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: .12em;
  margin-bottom: 10px;
}

.metric-value {
  font-family: "Playfair Display", serif;
  font-size: 25px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 15px;
}

.section-title h3 {
  font-family: "Playfair Display", serif;
  font-size: 34px;
  font-weight: 500;
  margin: 0;
}

.section-title span {
  color: var(--muted);
  font-size: 11px;
}

.runners {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.runner {
  background: white;
  border: 2px solid var(--purple);
  border-radius: 22px;
  padding: 23px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 15px;
}

.runner:nth-child(2) {
  border-color: var(--orange);
}

.runner-rank {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 7px;
}

.runner-city {
  font-family: "Playfair Display", serif;
  font-size: 30px;
}

.runner-score {
  font-family: "Playfair Display", serif;
  font-size: 28px;
  background: var(--lime);
  padding: 5px 10px;
  border-radius: 10px;
  height: fit-content;
}

.hotel-box {
  margin-top: 15px;
  background: var(--orange);
  color: white;
  border-radius: 18px;
  padding: 18px;
}

.hotel-title {
  font-size: 13px;
  font-weight: 800;
}

.hotel-meta {
  margin-top: 6px;
  font-size: 11px;
  opacity: .9;
}

.bottom-note {
  text-align: center;
  margin-top: 70px;
  padding-top: 45px;
  border-top: 2px solid var(--line);
}

.bottom-note h3 {
  font-family: "Playfair Display", serif;
  font-size: 40px;
  font-weight: 500;
  margin: 0 0 12px;
}

.bottom-note p {
  color: var(--muted);
  font-size: 13px;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}

.loading-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--orange);
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from {
    opacity: .25;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

  .shell {
    width: min(100% - 30px, 600px);
  }

  .hero-grid {
    grid-template-columns: 1fr;
    gap: 35px;
    padding-top: 25px;
  }

  .travel-visual {
    height: 390px;
    border-radius: 28px;
  }

  .form-header {
    display: block;
  }

  .form-header p {
    margin-top: 18px;
  }

  .tag-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .invites {
    grid-template-columns: 1fr;
  }

  .metrics {
    grid-template-columns: repeat(2, 1fr);
  }

  .runners {
    grid-template-columns: 1fr;
  }

  .result-content {
    inset: auto 25px 25px;
  }

  .result-hero {
    min-height: 480px;
    border-radius: 28px;
  }
}

@media (max-width: 520px) {

  .topbar {
    height: 70px;
  }

  h1 {
    font-size: 55px;
  }

  .date-grid {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .tag-grid {
    grid-template-columns: 1fr 1fr;
  }

  .form-card {
    border-radius: 23px;
    padding: 22px;
  }

  .metrics {
    grid-template-columns: 1fr 1fr;
  }

  .metric {
    padding: 17px;
  }

  .metric-value {
    font-size: 20px;
  }

  .result-city {
    font-size: 70px;
  }
}
</style>
</head>

<body>

<input id="api-base" value="http://localhost:8000">

<div id="app"></div>

<script>

/* =========================================================
   API
   НЕ МЕНЯЕМ ENDPOINTS И ФОРМАТЫ ДАННЫХ
========================================================= */

const app = document.getElementById('app');
const apiBaseInput = document.getElementById('api-base');

function apiBase() {
  return apiBaseInput.value.replace(/\/$/, '');
}

const VIBE_TAGS = [
  'расслабон',
  'движ',
  'культура',
  'еда',
  'природа',
  'бюджет'
];

const MUST_HAVES = [
  'no_transfers',
  'budget_stay',
  'food_nearby'
];

const VIBE_INFO = {
  'расслабон': ['☁', 'Спокойствие'],
  'движ': ['↗', 'Приключения'],
  'культура': ['◈', 'Культура'],
  'еда': ['✦', 'Еда'],
  'природа': ['⌁', 'Природа'],
  'бюджет': ['₽', 'Бюджет']
};

const MUST_INFO = {
  no_transfers: ['→', 'Без пересадок'],

/* =========================================================
   ROUTER
========================================================= */

function route() {

  const hash = location.hash.slice(2);
  const parts = hash.split('/').filter(Boolean);

  if (
    parts[0] === 'join' &&
    parts[1] &&
    parts[2]
  ) {
    return renderJoin(
      parts[1],
      parts[2]
    );
  }

  if (
    parts[0] === 'wait' &&
    parts[1]
  ) {
    return renderWait(parts[1]);
  }

  if (
    parts[0] === 'result' &&
    parts[1]
  ) {
    return renderResult(parts[1]);
  }

  return renderCreate();
}

window.addEventListener(
  'hashchange',
  route
);


/* =========================================================
   API
========================================================= */

async function api(path, opts) {

  const res = await fetch(
    apiBase() + path,
    {
      headers: {
        'Content-Type': 'application/json'
      },
      ...opts
    }
  );

  if (!res.ok) {

    let msg = res.status;

    try {
      msg =
        (await res.json()).message ||
        msg;
    } catch (e) {}

    throw new Error(msg);
  }

  return res.json();
}

let pollTimer = null;


function renderWait(

        >

            <span class="loading-dot"></span>

          </div>

        </div>


      </div>

    </div>
  `;


  const statusEl =
    document.getElementById(
      'wait-status'
    );


  clearInterval(
    pollTimer
  );


  const check =
    async () => {

      try {

        const data =
          await api(
            `/session/${sessionId}/status`
          );


        const p1 =
          data.participant_1_submitted;

        const p2 =
          data.participant_2_submitted;


        statusEl.innerHTML = `

          <div
            class="status-pill
            ${p1 ? 'done' : ''}"
          >

            ${p1 ? '✓' : '○'}

          </div>


          <div
            class="status-pill
            ${p2 ? 'done' : ''}"
          >

            ${p2 ? '✓' : '○'}

            Участник 02

          </div>

        `;


        if (p1 && p2) {

          clearInterval(
            pollTimer
          );


          setTimeout(() => {

            location.hash =
              `#/result/${sessionId}`;

          }, 500);

        }


      } catch (e) {

        statusEl.innerHTML = `

          <div class="error">

            ${escapeHtml(
              e.message
            )}

          </div>

        `;

      }

    };


  check();

  pollTimer =
    setInterval(
      check,
      2000

                          </div>


                          <div class="runner-city">

                            ${escapeHtml(
                              m.city ||
                              'Неизвестно'
                            )}

                          </div>

                        </div>


                        <div class="runner-score">

                          ${normalizeScore(
                            m.total_score
                          )}%

                        </div>


                      </div>

                    `
                  )
                  .join('')}


              </div>


            </section>

          `
          : ''
      }


      <div class="bottom-note">

        <h3>
          Ваш компромисс найден.
        </h3>

        <p>
          Два набора желаний. Один город.
          Осталось только купить билеты.
        </p>

      </div>

    `;


  } catch (e) {

    out.innerHTML = `

      <div class="form-card">

        <div class="error">

          Не удалось загрузить результат:
          ${escapeHtml(
            e.message
          )}

        </div>

      </div>

    `;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeScore(score) {

  let n =
    Number(score || 0);


  if (n <= 1) {
    n *= 100;
  }


  return Math.round(
    Math.max(
      0,
      Math.min(
        100,
        n
      )
    )
  );

}


function formatMoney(value) {

  return Number(
    value || 0
  ).toLocaleString(
    'ru-RU'
  );

}


function escapeHtml(value) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttr(value) {

  return escapeHtml(value);

}


const CITY_IMAGES = {

  rome:
    'https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=1600&q=85',

  paris:
    'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1600&q=85',

  barcelona:
    'https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=1600&q=85',

  lisbon:
    'https://images.unsplash.com/photo-1555881400-74d7acaacd8b?auto=format&fit=crop&w=1600&q=85',

  prague:
    'https://images.unsplash.com/photo-1519671282429-b44660ead0a7?auto=format&fit=crop&w=1600&q=85',

  budapest:
    'https://images.unsplash.com/photo-1541849546-216549ae216d?auto=format&fit=crop&w=1600&q=85',

  istanbul:
    'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?auto=format&fit=crop&w=1600&q=85',

  amsterdam:
    'https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1600&q=85'

};


function cityImage(city) {

  const key =
    String(city || '')
      .toLowerCase()
      .trim();


  for (
    const name in CITY_IMAGES
  ) {

    if (
      key.includes(name)
    ) {

      return CITY_IMAGES[name];

    }

  }


  return 'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85';

}
